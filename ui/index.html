<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Strata</title>
  <link rel="icon" href="img/icon.png" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="preload" href="fonts/archivo.woff2" as="font" type="font/woff2" crossorigin />
</head>
<body>
  <div class="boot" id="boot"><canvas></canvas><div class="micro skip">Press any key to skip</div></div>

  <header class="topbar" id="topbar" data-tauri-drag-region></header>
  <div class="running hidden" id="running"></div>

  <main>
    <section class="view" id="view-home">
      <div id="home">
        <div class="backdrop"><div class="stripes"></div><div class="img"></div><div class="img"></div><div class="shade"></div></div>
        <div class="content"></div>
      </div>
    </section>
    <section class="view" id="view-library"><div class="page"></div></section>
    <section class="view" id="view-settings"><div class="page"></div></section>
    <section class="view" id="view-dev"><div class="page"></div></section>
  </main>

  <footer class="hints" id="hints"></footer>

  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer"></aside>
  <div class="modal" id="wizard"></div>
  <div class="toasts" id="toasts"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
