name: Build Strata (Windows)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Unit tests run on Linux during development. On Windows a test binary that links
      # Tauri has no app manifest and fails with STATUS_ENTRYPOINT_NOT_FOUND, so CI only builds.

      - name: Build app and installer
        run: npx --yes @tauri-apps/cli@^2 build

      - name: Collect files
        shell: pwsh
        run: |
          $ver = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force out/Strata | Out-Null
          Copy-Item src-tauri/target/release/strata.exe out/Strata/Strata.exe
          Copy-Item LICENSE.txt out/Strata/
          Copy-Item ui/fonts/OFL-*.txt out/Strata/
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe out/
          Compress-Archive -Path out/Strata -DestinationPath "out/Strata-$ver-beta-portable.zip"
          Get-ChildItem out -File | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Strata-Windows
          path: out/**
          if-no-files-found: error

      # Attaches the files to the release of this tag (creates it if needed).
      # Name and notes are left alone so text written on GitHub is never overwritten.
      - name: Publish GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, 'beta') }}
          files: |
            out/*-setup.exe
            out/*-portable.zip
            out/SHA256SUMS.txt
