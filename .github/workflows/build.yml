name: Build Strata (Windows)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Unit tests run on Linux during development. On Windows a test binary that links
      # Tauri has no app manifest and fails with STATUS_ENTRYPOINT_NOT_FOUND, so CI only builds.
      - name: Build app and installer
        run: npx --yes @tauri-apps/cli@^2 build

      - name: Collect files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/Strata | Out-Null
          Copy-Item src-tauri/target/release/strata.exe out/Strata/Strata.exe
          Copy-Item LICENSE.txt out/Strata/ -ErrorAction SilentlyContinue
          Copy-Item ui/fonts/OFL-*.txt out/Strata/
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe out/

      - uses: actions/upload-artifact@v4
        with:
          name: Strata-Windows
          path: out/**
          if-no-files-found: error
